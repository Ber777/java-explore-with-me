statsserver.url: http://localhost:9090

server:
  port: 8080

spring:
  application:
    name: ewm-service
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ewmdb
    username: postgres
    password: 123456

logging:
  level:
    ewm: DEBUG
    org.springframework.orm.jpa: INFO
    org.springframework.transaction: INFO
    org.springframework.jdbc: DEBUG
    com.zaxxer.hikari: DEBUG
