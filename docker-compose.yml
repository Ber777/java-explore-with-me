version: '3.8'
services:
  stats-db:
    image: postgres:latest
    container_name: stats-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: statsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 60s  # дополнительное время на инициализацию
    volumes:
      - postgres_data:/var/lib/postgresql/data

  stats-server:
    build: stats-server
    container_name: stats-server
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy  # ожидание готовности БД
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/statsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://stats-server:9090/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  ewm-service:
    build: ewm-service
    container_name: ewm-service
    ports:
      - "8080:8080"
    depends_on:
      stats-server:
        condition: service_healthy  # ожидание готовности stats-server
    environment:
      STATS_SERVER_URL: http://stats-server:9090

volumes:
  postgres_data: